<svg width="1600" height="590" viewBox="0 0 1600 590" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.025"/>
      <circle cx="4" cy="3" r="0.6" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="590" fill="#0a0a0b"/>
  <rect width="1600" height="590" fill="url(#grain)"/>
  <rect width="1600" height="590" fill="url(#vignette)"/>

  <!-- top bar -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.5s" fill="freeze"/>
    <text x="80" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#9a9a9a" font-weight="600">AK&#160;&#160;/&#160;&#160;SOFTWARE&#160;DEVELOPER</text>
  </g>

  <g>
    <rect x="1478" y="46" width="9" height="9" fill="none" stroke="#e8e8e8" stroke-width="1.4"/>
    <rect x="1497" y="46" width="9" height="9" fill="#e8e8e8">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="1520" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#9a9a9a" font-weight="600">01</text>
  </g>

  <!-- top rule draws in -->
  <line x1="80" y1="92" x2="1520" y2="92" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"
        stroke-dasharray="1440" stroke-dashoffset="1440">
    <animate attributeName="stroke-dashoffset" from="1440" to="0" begin="0.15s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </line>

  <!-- headline, staggered fade-up -->
  <g transform="translate(0,16)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.35s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="76" y="222" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#f4f4f3">BUILDING</text>
  </g>
  <g transform="translate(0,16)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.5s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="76" y="326" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#f4f4f3">SOFTWARE&#160;THAT</text>
  </g>
  <g transform="translate(0,16)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.65s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="76" y="430" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#f4f4f3">SCALES.</text>
    <rect x="500" y="358" width="10" height="80" fill="#f4f4f3">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" begin="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bio blurb -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.6s" fill="freeze"/>
    <text x="80" y="480" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" font-style="italic">Software Developer &#8212; building full-stack products with</text>
    <text x="80" y="503" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" font-style="italic">clarity, performance, and a lot of care.</text>
  </g>

  <!-- secondary headline, bottom right, staggered fade-up -->
  <g transform="translate(0,14)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.55s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="1520" y="330" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#f4f4f3">TURNING</text>
  </g>
  <g transform="translate(0,14)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.68s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.68s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="1520" y="382" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#f4f4f3">IDEAS&#160;INTO</text>
  </g>
  <g transform="translate(0,14)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.81s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.81s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="1520" y="434" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#e2e2e2">INTERFACES</text>
  </g>

  <!-- bottom rule draws in -->
  <line x1="80" y1="528" x2="1520" y2="528" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"
        stroke-dasharray="1440" stroke-dashoffset="1440">
    <animate attributeName="stroke-dashoffset" from="1440" to="0" begin="1.15s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
    <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#707070" font-weight="600">EST.&#160;2026</text>
    <text x="1520" y="560" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#707070" font-weight="600">AVAILABLE&#160;FOR&#160;WORK</text>
  </g>
</svg>
